name: Update README cards

on:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/grs.yml
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_FOR_PRIVATE_REPOS_STATS }}

      - name: Test fork-inclusive commit counter
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Count my commits including forks
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_PRIVATE_REPOS_STATS }}
        run: python3 scripts/generate_commit_card.py --username "$GITHUB_REPOSITORY_OWNER" --require-private

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&count_private=true&hide_rank=true
          path: profile/stats.svg
          token: ${{ secrets.PAT_FOR_PRIVATE_REPOS_STATS }}

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&count_private=true
          path: profile/streak.svg
          token: ${{ secrets.PAT_FOR_PRIVATE_REPOS_STATS }}
    
      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&bg_color=0D1117&count_private=true&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_FOR_PRIVATE_REPOS_STATS }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update README cards"
          git push
